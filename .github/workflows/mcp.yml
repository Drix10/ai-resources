name: MCP server tests

on:
  pull_request:
    paths: ["mcp/**"]
  push:
    branches: [main]
    paths: ["mcp/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
