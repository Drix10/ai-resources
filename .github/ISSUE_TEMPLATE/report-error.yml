name: Report an error
description: A wrong number, name, link or summary in a digest.
title: "[Error] "
labels: ["correction"]
body:
  - type: input
    id: digest
    attributes:
      label: Digest
      description: Link to the resources-NNN.md file (or the blog page).
    validations:
      required: true
  - type: input
    id: item
    attributes:
      label: Item headline
    validations:
      required: true
  - type: textarea
    id: wrong
    attributes:
      label: What is wrong, and the correct version
      description: Include a link to the source that shows the correction.
    validations:
      required: true
